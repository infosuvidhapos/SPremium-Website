name: Build IIS + SQL 2019 Backup

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

concurrency:
  group: suvidhapremium-build
  cancel-in-progress: true

jobs:
  build-package:
    name: Build self-contained IIS + SQL 2019 BAK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained Windows x64 for IIS
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish ./src/SuvidhaPremium/SuvidhaPremium.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:UseAppHost=true \
            -o ./artifacts/iis-publish

          test -s ./artifacts/iis-publish/SuvidhaPremium.exe
          test -s ./artifacts/iis-publish/SuvidhaPremium.dll
          test -s ./artifacts/iis-publish/web.config
          grep -q "SuvidhaPremium.exe" ./artifacts/iis-publish/web.config

      - name: Validate outlet update verbs and manual validity calendar
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'remove name="WebDAVModule"' ./src/SuvidhaPremium/web.config
          grep -q 'remove name="WebDAV"' ./src/SuvidhaPremium/web.config
          grep -q 'new\[\] { "PUT", "POST" }' ./src/SuvidhaPremium/Program.cs
          grep -q 'RenewToDateAsync' ./src/SuvidhaPremium/Program.cs
          grep -q 'ValidUntilDate' ./src/SuvidhaPremium/Program.cs
          grep -q 'id="manualValidityDate"' ./src/SuvidhaPremium/wwwroot/index.html
          grep -q 'data-days="manual"' ./src/SuvidhaPremium/wwwroot/index.html
          grep -q "renewMode==='manual'" ./src/SuvidhaPremium/wwwroot/assets/js/app.js

      - name: Generate temporary SQL password
        shell: bash
        run: |
          set -euo pipefail
          PASS="Build!$(openssl rand -hex 16)Aa1#"
          echo "MSSQL_SA_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Prepare SQL backup directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/database-backup"
          chmod 777 "$GITHUB_WORKSPACE/artifacts/database-backup"

      - name: Start SQL Server 2019
        shell: bash
        run: |
          set -euo pipefail
          docker pull mcr.microsoft.com/mssql/server:2019-latest
          docker run --name suvidhapos-sql \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" \
            -p 1433:1433 \
            -v "$GITHUB_WORKSPACE/artifacts/database-backup:/var/opt/mssql/backup" \
            -d mcr.microsoft.com/mssql/server:2019-latest

      - name: Wait for SQL Server
        shell: bash
        run: |
          set -euo pipefail
          if docker exec suvidhapos-sql test -x /opt/mssql-tools18/bin/sqlcmd; then
            SQLCMD=/opt/mssql-tools18/bin/sqlcmd
          else
            SQLCMD=/opt/mssql-tools/bin/sqlcmd
          fi

          for i in $(seq 1 60); do
            if docker exec suvidhapos-sql "$SQLCMD" -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server 2019 is ready."
              exit 0
            fi
            sleep 2
          done

          docker logs suvidhapos-sql
          exit 1

      - name: Create database schema
        shell: bash
        run: |
          set -euo pipefail
          docker cp Database/01_CreateDatabase.sql suvidhapos-sql:/tmp/01_CreateDatabase.sql

          if docker exec suvidhapos-sql test -x /opt/mssql-tools18/bin/sqlcmd; then
            SQLCMD=/opt/mssql-tools18/bin/sqlcmd
          else
            SQLCMD=/opt/mssql-tools/bin/sqlcmd
          fi

          docker exec suvidhapos-sql "$SQLCMD" \
            -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b \
            -i /tmp/01_CreateDatabase.sql

      - name: Create and verify real SQL Server 2019 BAK
        shell: bash
        run: |
          set -euo pipefail
          docker cp Database/06_CreateBuildBackup.sql suvidhapos-sql:/tmp/06_CreateBuildBackup.sql

          if docker exec suvidhapos-sql test -x /opt/mssql-tools18/bin/sqlcmd; then
            SQLCMD=/opt/mssql-tools18/bin/sqlcmd
          else
            SQLCMD=/opt/mssql-tools/bin/sqlcmd
          fi

          docker exec suvidhapos-sql "$SQLCMD" \
            -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b \
            -i /tmp/06_CreateBuildBackup.sql

          BAK="$GITHUB_WORKSPACE/artifacts/database-backup/SuvidhaPremium.bak"

          docker exec suvidhapos-sql chmod 0644 /var/opt/mssql/backup/SuvidhaPremium.bak
          sudo chown "$(id -u):$(id -g)" "$BAK"
          chmod 0644 "$BAK"

          test -s "$BAK"
          sha256sum "$BAK" > "$BAK.sha256"

          {
            echo "SuvidhaPremium build backup"
            echo "Generated UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Source engine: SQL Server 2019 Developer container"
            echo "Database: SuvidhaPremium"
            echo "Validation: RESTORE VERIFYONLY WITH CHECKSUM passed"
            echo "Restore target: SQL Server / SQL Express 2019 or newer"
            echo "Contents: clean schema baseline; no default admin password or production secrets"
          } > "$GITHUB_WORKSPACE/artifacts/database-backup/BACKUP-INFO.txt"

      - name: Assemble final deployment ZIP
        shell: bash
        run: |
          set -euo pipefail

          PKG="$GITHUB_WORKSPACE/artifacts/package"
          mkdir -p "$PKG/IIS-Publish" "$PKG/DatabaseBackup"

          cp -a ./artifacts/iis-publish/. "$PKG/IIS-Publish/"
          cp -a ./artifacts/database-backup/. "$PKG/DatabaseBackup/"
          cp -a ./Database "$PKG/Database"
          cp -a ./Deploy "$PKG/Deploy"
          cp ./README.md "$PKG/README.md"
          cp ./START-HERE-HINDI.txt "$PKG/START-HERE-HINDI.txt"

          test -s "$PKG/IIS-Publish/SuvidhaPremium.exe"
          test -s "$PKG/DatabaseBackup/SuvidhaPremium.bak"

          (
            cd "$PKG"
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

          cd "$GITHUB_WORKSPACE/artifacts"
          zip -r -9 SuvidhaPremium-NET10-IIS-WITH-SQL2019-BACKUP.zip package

          test -s SuvidhaPremium-NET10-IIS-WITH-SQL2019-BACKUP.zip

      - name: Publish build ZIP to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          ZIP="$GITHUB_WORKSPACE/artifacts/SuvidhaPremium-NET10-IIS-WITH-SQL2019-BACKUP.zip"

          gh release create "$TAG" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SuvidhaPremium Build #${GITHUB_RUN_NUMBER}" \
            --notes "Self-contained Windows x64 IIS build with verified SQL Server 2019 backup. Generated by GitHub Actions run #${GITHUB_RUN_NUMBER}." \
            --prerelease

      - name: SQL container logs on failure
        if: failure()
        shell: bash
        run: docker logs suvidhapos-sql || true
